[package]
name = "backend"
version = "0.1.0"
edition = "2021"
authors = ["VladMontana"]

[dependencies]
# Web & Async runtime
tokio = { version = "1.43", features = ["full"] }
axum = { version = "0.8.1", features = ["multipart"] }
tower = { version = "0.5" }
tower-http = { version = "0.6", features = ["trace", "cors", "fs"] }

# Database
sqlx = { version = "0.8.6", default-features = false, features = [
    "sqlite",
    "runtime-tokio",
    "migrate",
    "macros"
] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Cryptography & Security
argon2 = { version = "0.5", features = ["std"] }
sha2 = "0.10"
rand = "0.8"
rpassword = "7"

# File Processing & Media
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
mime_guess = "2.0"
tempfile = "3.17"

# Utilities
uuid = { version = "1.16", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
thiserror = "2.0"
futures-util = "0.3"
http-body-util = "0.1"

[profile.dev]
opt-level = 2
debug = 0
strip = true
incremental = false

[profile.release]
opt-level = 3
debug = 0
strip = true
lto = true
codegen-units = 1
panic = "abort"
