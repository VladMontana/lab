# ==============================================================================
# LabNotes: HTTP конфигурация Nginx (Порт 80)
# ==============================================================================
# Данный файл активен по умолчанию. Он принимает запросы на 80 порту,
# проксирует их в контейнер LabNotes и обеспечивает верификацию домена
# для получения бесплатного SSL-сертификата Let's Encrypt / Certbot.
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name _; # Принимает любые входящие домены и IP-адреса

    # Верификация домена через Certbot (ACME HTTP-01 challenge)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Проксирование всех запросов в приложение LabNotes
    location / {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;

        # Передача реальных заголовков клиента
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Поддержка WebSockets и Streaming
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Таймауты для долгих запросов (например, конвертация больших DOCX)
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }
}
