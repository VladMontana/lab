name: labnotes

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: labnotes:latest
    container_name: labnotes
    restart: unless-stopped
    ports:
      # Localhost loopback binding only: prevents direct WAN exposure without reverse proxy
      - "127.0.0.1:8080:8080"
    volumes:
      # Persistent storage volume for SQLite database, WAL files, and media uploads
      - data:/app/data
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=8080
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:8080}
      - DATA_DIR=/app/data
      - DATABASE_URL=sqlite:///app/data/labnotes.sqlite?mode=rwc
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - SESSION_SECRET=${SESSION_SECRET:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  nginx:
    image: nginx:alpine
    container_name: labnotes_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      app:
        condition: service_healthy

  certbot:
    image: certbot/certbot:latest
    container_name: labnotes_certbot
    profiles: ["certbot"]
    volumes:
      - certbot_www:/var/www/certbot:rw
      - certbot_certs:/etc/letsencrypt:rw

volumes:
  data:
    name: labnotes_data
  certbot_www:
    name: labnotes_certbot_www
  certbot_certs:
    name: labnotes_certbot_certs
